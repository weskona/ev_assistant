name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: e.g. "I'm always frustrated when ..." — leave blank if not applicable.

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered

  - type: dropdown
    id: evcc-related
    attributes:
      label: Is this related to evcc (charge mode/target-SoC control)?
      options:
        - "Yes"
        - "No"
        - Not sure

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Vehicle/integration involved, screenshots, related issues, etc.
