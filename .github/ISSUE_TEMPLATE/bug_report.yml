name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Since EV Assistant works from whatever
        entities you point it at (manufacturer integration, OBD dongle, evcc, ...), most bugs
        turn out to be about *how* a specific vehicle/sensor combination reports its data —
        the config and log details below help a lot in tracking that down.

  - type: input
    id: version
    attributes:
      label: EV Assistant version
      placeholder: e.g. 0.31.0
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.7.4
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
    validations:
      required: true

  - type: input
    id: vehicle
    attributes:
      label: Vehicle (manufacturer + model)
      placeholder: e.g. Peugeot e-Rifter
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: >
        Which entities is EV Assistant reading (SoC, odometer, plug/motor sensor, power,
        wallbox energy, ...)? Settings → Devices & Services → EV Assistant → Configure shows
        the currently selected entities per step.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Enable debug logging for `custom_components.ev_assistant` (Settings → Devices &
        Services → EV Assistant → ⋮ → Enable debug logging), reproduce the issue, then paste
        the relevant excerpt here. Please redact anything sensitive (tokens, precise GPS
        coordinates, etc.).
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might be relevant (screenshots, related issues, ...).
