name: Validate

on:
  # push nur auf den Dauer-Branches, sonst laeuft alles doppelt (push + pull_request)
  push:
    branches: [main, glow-panel]
  pull_request:
  # Vom Release-Workflow vorgeschaltet (siehe release.yml). Die HACS-Pruefung
  # laeuft dort bewusst nicht mit: sie laeuft ohnehin bei jedem Push auf main
  # fuer denselben Commit, und ihr Verhalten im Tag-Kontext ist nicht
  # abgesichert. Im aufgerufenen Workflow zeigt github.event_name/github.ref
  # weiter auf den Tag-Push des Aufrufers.
  workflow_call:

jobs:
  validate:
    name: Validate HACS
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Validate hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ruff
        uses: astral-sh/ruff-action@v3

  # Schuetzt die Zusage "Engine-Tests brauchen kein Home Assistant" (siehe
  # requirements_test.txt/pyproject.toml): installiert bewusst NUR pytest und
  # NICHT requirements_test.txt. Ein Test, der ueber
  # custom_components.ev_assistant importiert (zieht __init__.py und damit
  # homeassistant/voluptuous nach), wird hier sofort rot -- im Job
  # "Test (pytest)" faellt das nie auf, weil dort HA installiert ist.
  engine-tests:
    name: Engine-Tests (ohne HA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pytest only
        run: python -m pip install pytest

      - name: Run pure engine tests
        run: python -m pytest tests/test_engine.py tests/test_const.py tests/test_check_release.py -q

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pytest-homeassistant-custom-component (requirements_test.txt) pinnt
      # eine konkrete Home-Assistant-Version und erfordert deren
      # Python-Version -- siehe requirements_test.txt fuer die Begruendung,
      # bei einem Versions-Update dort ggf. mitziehen.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      # Deckt beide Test-Stile in einem Lauf ab: tests/test_engine.py (reine
      # Logik, kein HA noetig) und tests/ha/ (Coordinator/config_flow/
      # __init__ ueber echte hass-/MockConfigEntry-Fixtures, siehe
      # tests/ha/conftest.py fuer die Koexistenz-Details).
      - name: Run tests
        run: pytest tests -q
