name: Release

on:
  push:
    tags:
      - "v*"
  # Gestartet von auto-tag.yml auf dem frisch angelegten Tag: ein Tag-Push mit
  # dem GITHUB_TOKEN loest den push-Trigger oben nicht aus. github.ref ist dabei
  # der Tag (refs/tags/vX.Y.Z), alle Schritte unten arbeiten unveraendert.
  workflow_dispatch:

jobs:
  # hassfest, Ruff und pytest muessen vor jedem Release gruen sein. Die HACS-
  # Pruefung ist im Tag-Kontext ausgenommen, siehe Kommentar in validate.yml.
  checks:
    name: Checks
    uses: ./.github/workflows/validate.yml

  release:
    name: Create Release
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Release 0.99.39 ging mit leerer manifest.json raus: Quelle, Version
      # und CHANGELOG vor dem Zippen pruefen ...
      - name: Check release sources
        run: python3 .github/scripts/check_release.py "${{ steps.version.outputs.VERSION }}"

      - name: Create release zip
        run: |
          cd custom_components/ev_assistant
          zip -r ../../ev_assistant.zip .

      # ... und danach noch einmal die fertige Zip, so wie HACS sie installiert.
      - name: Check release zip
        run: python3 .github/scripts/check_release.py "${{ steps.version.outputs.VERSION }}" --zip ev_assistant.zip

      - name: Extract changelog section for this version
        run: |
          VERSION_NUM="${{ steps.version.outputs.VERSION }}"
          VERSION_NUM="${VERSION_NUM#v}"
          awk -v ver="$VERSION_NUM" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "_No changelog notes found for this version._" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          files: ev_assistant.zip
          body_path: release_notes.md
          generate_release_notes: false
          # Tags mit Suffix (z. B. v0.99.35-glow.1) sind Pre-Releases: HACS
          # zeigt sie nur Nutzern mit "Show beta versions", und GitHub zaehlt
          # sie nie als "Latest release".
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
