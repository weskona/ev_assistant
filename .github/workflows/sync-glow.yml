name: Sync Glow card

# Haelt die Kopie der Glow-Karte auf main auf dem Stand eines gepinnten
# Releases von deepblue120/glow-dashboard (siehe #12).
#   - Quelle der Wahrheit ist glow-dashboard; die Datei wird nie von Hand editiert.
#   - frontend/GLOW_VERSION enthaelt genau eine Referenz (Tag oder Commit).
#   - Gibt es einen neueren v*-Tag, oeffnet dieser Workflow einen PR gegen
#     main (geprueft von glow-sync-check.yml und der uebrigen CI). Gemergt wird
#     von Hand.
#   - Seit 0.99.65 zaehlt der PR zugleich die Patch-Version im Manifest hoch und
#     legt in BEIDEN CHANGELOG.md einen Abschnitt "## [X.Y.Z]" an: Mit dem Merge
#     entsteht so ueber auto-tag.yml/release.yml selbst ein Release. Der Bump
#     passiert nur, wenn die aktuelle Manifest-Version schon getaggt ist (sonst
#     wartet ohnehin noch eine unveroeffentlichte Version); ein Merge-Konflikt
#     (Manifest/CHANGELOG hat sich auf main bewegt) loest sich, indem der
#     Workflow neu laeuft -- er baut den PR aus dem aktuellen main neu.
# Der Workflow liegt auf main, weil GitHub zeitgesteuerte und manuell gestartete
# Workflows nur vom Standard-Branch ausfuehrt.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag oder Commit aus deepblue120/glow-dashboard (leer = neuester v*-Tag)"
        required: false
        type: string
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Glow-Karte abgleichen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Zielversion bestimmen und Karte laden
        id: glow
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REPO=https://github.com/deepblue120/glow-dashboard
          DIR=custom_components/ev_assistant/frontend
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs --sort=-v:refname "$REPO" 'v*' | head -n1 | sed 's|.*refs/tags/||')
          fi
          if [ -z "$REF" ]; then
            echo "Im glow-dashboard gibt es noch keinen v*-Tag, nichts zu tun."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(tr -d '[:space:]' < "$DIR/GLOW_VERSION")
          if [ "$REF" = "$CURRENT" ]; then
            echo "Kopie ist bereits auf $CURRENT."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsSL "https://raw.githubusercontent.com/deepblue120/glow-dashboard/$REF/dist/mg-car-dashboard.js" -o "$DIR/mg-car-dashboard.js"
          printf '%s\n' "$REF" > "$DIR/GLOW_VERSION"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Version und CHANGELOG hochzaehlen
        if: steps.glow.outputs.changed == 'true'
        id: bump
        env:
          GLOW_REF: ${{ steps.glow.outputs.ref }}
          GLOW_CURRENT: ${{ steps.glow.outputs.current }}
        run: |
          set -euo pipefail
          MANIFEST=custom_components/ev_assistant/manifest.json
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "$MANIFEST" | head -n1)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$VERSION' ist keine stabile Version X.Y.Z, kein Bump."
            exit 0
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION ist noch nicht getaggt, kein Bump."
            exit 0
          fi
          NEW="${VERSION%.*}.$(( ${VERSION##*.} + 1 ))"
          sed -i "s/\"version\": *\"$VERSION\"/\"version\": \"$NEW\"/" "$MANIFEST"
          python3 - "$NEW" "$GLOW_CURRENT" "$GLOW_REF" <<'PY'
          import datetime, sys
          new, old, ref = sys.argv[1:4]
          entry = (
              f"## [{new}] - {datetime.date.today().isoformat()}\n\n"
              "### Changed\n\n"
              f"- **Glow card updated from {old} to {ref}** (automatic sync from "
              "[deepblue120/glow-dashboard](https://github.com/deepblue120/glow-dashboard), "
              f"[changes](https://github.com/deepblue120/glow-dashboard/compare/{old}...{ref})).\n\n"
          )
          for path in ("CHANGELOG.md", "custom_components/ev_assistant/CHANGELOG.md"):
              text = open(path, encoding="utf-8").read()
              marker = "\n## ["
              if f"## [{new}]" in text or marker not in text:
                  continue
              index = text.index(marker) + 1
              open(path, "w", encoding="utf-8").write(text[:index] + entry + text[index:])
          PY
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: PR gegen main oeffnen
        if: steps.glow.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: sync/glow-${{ steps.glow.outputs.ref }}
          add-paths: |
            custom_components/ev_assistant/frontend/mg-car-dashboard.js
            custom_components/ev_assistant/frontend/GLOW_VERSION
            custom_components/ev_assistant/manifest.json
            CHANGELOG.md
            custom_components/ev_assistant/CHANGELOG.md
          commit-message: "Glow-Karte auf ${{ steps.glow.outputs.ref }} aktualisiert"
          title: "Glow-Karte auf ${{ steps.glow.outputs.ref }} aktualisieren"
          body: |
            Automatischer Abgleich mit [deepblue120/glow-dashboard](https://github.com/deepblue120/glow-dashboard).

            - Vorher: `${{ steps.glow.outputs.current }}`
            - Nachher: `${{ steps.glow.outputs.ref }}`

            Ersetzt `frontend/mg-car-dashboard.js` durch die Datei dieser Version und setzt `frontend/GLOW_VERSION`. ${{ steps.bump.outputs.new && format('Zaehlt die Version im Manifest auf `{0}` hoch und legt den CHANGELOG-Abschnitt an: Mit dem Merge entsteht automatisch das Release `v{0}` (auto-tag.yml). Der Text im CHANGELOG ist nur der Hinweis auf die Karten-Version, bei Bedarf vor dem Merge im PR ergaenzen.', steps.bump.outputs.new) || 'Die Manifest-Version wurde nicht erhoeht (die aktuelle Version ist noch nicht getaggt oder keine stabile Version); ein Release entsteht erst mit dem naechsten Versionsbump.' }} (siehe #12).
