name: Sync Glow card

# Haelt die Kopie der Glow-Karte auf dem Branch glow-panel auf dem Stand eines
# gepinnten Releases von deepblue120/glow-dashboard (siehe #12).
#   - Quelle der Wahrheit ist glow-dashboard; die Datei wird nie von Hand editiert.
#   - frontend/GLOW_VERSION enthaelt genau eine Referenz (Tag oder Commit).
#   - Gibt es einen neueren v*-Tag, oeffnet dieser Workflow einen PR gegen
#     glow-panel. Gemergt wird von Hand, nichts landet ungeprueft bei Testern.
#   - Der PR erhoeht zugleich die Glow-Nummer im Manifest (X.Y.Z-glow.N ->
#     X.Y.Z-glow.N+1), damit glow-prerelease.yml nach dem Merge ein neues
#     Pre-Release anlegt. Gibt es zu X.Y.Z schon eine Stable, wird stattdessen
#     X.Y.(Z+1)-glow.1 gesetzt, damit die Glow-Version ueber der Stable liegt.
# Der Workflow liegt auf main, weil GitHub zeitgesteuerte und manuell gestartete
# Workflows nur vom Standard-Branch ausfuehrt. Er aendert nur glow-panel.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag oder Commit aus deepblue120/glow-dashboard (leer = neuester v*-Tag)"
        required: false
        type: string
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Glow-Karte abgleichen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout glow-panel
        uses: actions/checkout@v4
        with:
          ref: glow-panel

      - name: Zielversion bestimmen und Karte laden
        id: glow
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REPO=https://github.com/deepblue120/glow-dashboard
          DIR=custom_components/ev_assistant/frontend
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs --sort=-v:refname "$REPO" 'v*' | head -n1 | sed 's|.*refs/tags/||')
          fi
          if [ -z "$REF" ]; then
            echo "Im glow-dashboard gibt es noch keinen v*-Tag, nichts zu tun."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(tr -d '[:space:]' < "$DIR/GLOW_VERSION")
          if [ "$REF" = "$CURRENT" ]; then
            echo "Kopie ist bereits auf $CURRENT."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsSL "https://raw.githubusercontent.com/deepblue120/glow-dashboard/$REF/dist/mg-car-dashboard.js" -o "$DIR/mg-car-dashboard.js"
          printf '%s\n' "$REF" > "$DIR/GLOW_VERSION"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Glow-Version im Manifest erhoehen
        if: steps.glow.outputs.changed == 'true'
        run: |
          set -euo pipefail
          MANIFEST=custom_components/ev_assistant/manifest.json
          python3 - "$MANIFEST" <<'PY'
          import re, subprocess, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          m = re.search(r'"version"\s*:\s*"(\d+)\.(\d+)\.(\d+)(?:-glow\.(\d+))?"', text)
          if not m:
              sys.exit("Manifest-Version nicht erkannt")
          x, y, z = int(m[1]), int(m[2]), int(m[3])
          n = int(m[4]) if m[4] else 0
          tags = subprocess.run(
              ["git", "ls-remote", "--tags", "--refs", "origin", "v*"],
              check=True, capture_output=True, text=True,
          ).stdout
          stable_exists = any(
              line.endswith(f"refs/tags/v{x}.{y}.{z}") for line in tags.splitlines()
          )
          if m[4] is None or stable_exists:
              new = f"{x}.{y}.{z + 1}-glow.1"
          else:
              new = f"{x}.{y}.{z}-glow.{n + 1}"
          text = text[: m.start()] + f'"version": "{new}"' + text[m.end():]
          open(path, "w", encoding="utf-8").write(text)
          print("Manifest-Version:", m[0], "->", new)
          PY

      - name: PR gegen glow-panel oeffnen
        if: steps.glow.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: glow-panel
          branch: sync/glow-${{ steps.glow.outputs.ref }}
          add-paths: |
            custom_components/ev_assistant/frontend/mg-car-dashboard.js
            custom_components/ev_assistant/frontend/GLOW_VERSION
            custom_components/ev_assistant/manifest.json
          commit-message: "Glow-Karte auf ${{ steps.glow.outputs.ref }} aktualisiert"
          title: "Glow-Karte auf ${{ steps.glow.outputs.ref }} aktualisieren"
          body: |
            Automatischer Abgleich mit [deepblue120/glow-dashboard](https://github.com/deepblue120/glow-dashboard).

            - Vorher: `${{ steps.glow.outputs.current }}`
            - Nachher: `${{ steps.glow.outputs.ref }}`

            Ersetzt `frontend/mg-car-dashboard.js` durch die Datei dieser Version und setzt `frontend/GLOW_VERSION`. Erhoeht ausserdem die Glow-Version im Manifest; nach dem Merge legt `glow-prerelease.yml` das Pre-Release an (siehe #12).
