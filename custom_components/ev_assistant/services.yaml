log_charge:
  name: Fremdladung erfassen
  description: >
    Bestaetigt eine offene Fremdladung mit manuell abgelesenen Werten
    (geladene kWh und Preis pro kWh vom Ladepunkt-Beleg) und schreibt sie in
    die Historie. Sind mehrere Fremdladungen gleichzeitig offen, waehlt
    start_ts die gemeinte aus (ohne Angabe: die aelteste). Ohne offene
    Ladung wird ein komplett manueller Einzeleintrag angelegt -- dafuer
    ergeben start_ts und end_ts zusammen die Ladedauer.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    kwh:
      name: Geladene kWh
      description: Am Ladepunkt abgerechnete Energiemenge (inkl. Verluste).
      required: true
      example: 21.4
      selector:
        number:
          min: 0
          max: 200
          step: 0.1
          unit_of_measurement: kWh
          mode: box
    price_kwh:
      name: Preis pro kWh
      description: Preis pro Kilowattstunde.
      required: true
      example: 0.59
      selector:
        number:
          min: 0
          max: 5
          step: 0.001
          unit_of_measurement: EUR/kWh
          mode: box
    start_ts:
      name: Startzeit (Unix)
      description: >
        Optional. Bei mehreren gleichzeitig offenen Fremdladungen: waehlt
        die zu bestaetigende aus (Wert aus deren start_ts-Attribut). Ohne
        offene Ladung: Startzeit fuer einen manuellen Einzeleintrag.
      required: false
      example: 1751884800
      selector:
        number:
          mode: box
    end_ts:
      name: Endzeit (Unix)
      description: >
        Optional, nur wirksam bei einem komplett manuellen Einzeleintrag
        (keine passende offene Ladung gefunden). Ergibt zusammen mit
        start_ts die Ladedauer. Bei einer bestaetigten erkannten Ladung
        stammt die Dauer weiterhin aus deren eigener Messung.
      required: false
      example: 1751888400
      selector:
        number:
          mode: box
    soc_start:
      name: SoC bei Ladebeginn (%)
      description: >
        Optional, nur wirksam bei einem komplett manuellen Einzeleintrag.
        Zusammen mit soc_end ergibt sich delta_soc. Bei einer bestaetigten
        erkannten Ladung stammen die SoC-Werte weiterhin aus deren eigener
        Messung.
      required: false
      example: 42
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
          mode: box
    soc_end:
      name: SoC bei Ladeende (%)
      description: Optional, siehe soc_start.
      required: false
      example: 80
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
          mode: box
    start_fee:
      name: Startgebühr
      description: >
        Optional. Pauschale Startgebühr manche Ladenetze/Ladepunkte
        zusätzlich zum kWh-Preis (vom Beleg), unabhängig von der geladenen
        Menge. Ohne Angabe: 0.
      required: false
      example: 1.0
      selector:
        number:
          min: 0
          max: 50
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    block_fee:
      name: Blockiergebühr
      description: >
        Optional. Pauschale Blockiergebühr (z.B. für zu langes
        Stehenlassen nach Ladeende), zusätzlich zum kWh-Preis und einer
        eventuellen Startgebühr -- manche Belege weisen beide getrennt
        aus. Ohne Angabe: 0.
      required: false
      example: 5.0
      selector:
        number:
          min: 0
          max: 50
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    time_fee:
      name: Zeitgebühr
      description: >
        Optional. Pauschale Zeitgebühr, wenn nach Ladedauer statt/
        zusätzlich zu kWh abgerechnet wird (manche Schnelllade-Netze),
        zusätzlich zum kWh-Preis und eventueller Start-/Blockiergebühr.
        Ohne Angabe: 0.
      required: false
      example: 3.0
      selector:
        number:
          min: 0
          max: 50
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    karte_id:
      name: Ladekarte
      description: >
        Optional. Welche Ladekarte für diese Ladung verwendet wurde (Wert
        aus deren id-Attribut, siehe add_ladekarte). Rein informativ,
        fließt nicht in die Kostenberechnung ein.
      required: false
      example: 1755000000000
      selector:
        number:
          mode: box
    anbieter:
      name: Anbieter
      description: >
        Optional. Ladenetz-/Betreibername, WO geladen wurde (z.B. "EnBW",
        "Ionity", "Aral pulse") -- etwas anderes als karte_id (WOMIT
        bezahlt wurde). Freitext, kein fester Katalog; im Panel werden
        bereits verwendete Namen als Vorschlag angeboten.
      required: false
      example: EnBW
      selector:
        text:

discard_pending:
  name: Offene Fremdladung verwerfen
  description: >
    Verwirft eine offene, unbestaetigte Fremdladung. Sind mehrere
    gleichzeitig offen, waehlt start_ts die gemeinte aus (ohne Angabe: die
    aelteste).
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    start_ts:
      name: Startzeit (Unix)
      description: >
        Optional. Bei mehreren gleichzeitig offenen Fremdladungen: waehlt
        die zu verwerfende aus (Wert aus deren start_ts-Attribut).
      required: false
      example: 1751884800
      selector:
        number:
          mode: box

edit_charge:
  name: Fremdladung nachträglich korrigieren
  description: >
    Korrigiert einen bereits bestätigten Historien-Eintrag nachträglich
    (z.B. Tippfehler beim Erfassen bemerkt). Alle Felder außer
    config_entry_id/erfasst_ts sind optional -- nur mitgegebene Werte
    werden geändert. Ändern sich kwh/price_kwh/start_fee/block_fee/time_fee,
    wird kosten aus den effektiven (neuen oder bisherigen) Werten neu
    berechnet und die Gesamtsummen (kWh/Kosten) um die Differenz angepasst. Ändern sich
    soc_start/soc_end, wird delta_soc automatisch neu berechnet. Der zu
    korrigierende Eintrag wird über erfasst_ts identifiziert (Wert aus
    dessen erfasst_ts-Attribut in der Historie).
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    erfasst_ts:
      name: Erfasst-Zeitstempel (Unix)
      description: Identifiziert den zu korrigierenden Historien-Eintrag (Wert aus dessen erfasst_ts-Attribut).
      required: true
      example: 1751884800
      selector:
        number:
          mode: box
    kwh:
      name: Geladene kWh
      description: Korrigierte Energiemenge.
      required: false
      example: 21.4
      selector:
        number:
          min: 0
          max: 200
          step: 0.1
          unit_of_measurement: kWh
          mode: box
    price_kwh:
      name: Preis pro kWh
      description: Korrigierter Preis pro Kilowattstunde.
      required: false
      example: 0.59
      selector:
        number:
          min: 0
          max: 5
          step: 0.001
          unit_of_measurement: EUR/kWh
          mode: box
    start_fee:
      name: Startgebühr
      description: >
        Optional. Korrigierte pauschale Startgebühr. Ohne Angabe bleibt
        die zuvor erfasste Gebühr des Eintrags unveraendert.
      required: false
      example: 1.0
      selector:
        number:
          min: 0
          max: 50
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    block_fee:
      name: Blockiergebühr
      description: >
        Optional. Korrigierte pauschale Blockiergebühr. Ohne Angabe bleibt
        die zuvor erfasste Gebühr des Eintrags unveraendert.
      required: false
      example: 5.0
      selector:
        number:
          min: 0
          max: 50
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    time_fee:
      name: Zeitgebühr
      description: >
        Optional. Korrigierte pauschale Zeitgebühr. Ohne Angabe bleibt die
        zuvor erfasste Gebühr des Eintrags unveraendert.
      required: false
      example: 3.0
      selector:
        number:
          min: 0
          max: 50
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    start_ts:
      name: Startzeit (Unix)
      required: false
      example: 1751884800
      selector:
        number:
          mode: box
    end_ts:
      name: Endzeit (Unix)
      description: >
        Optional. Wird zusammen mit dem (neuen oder bisherigen) start_ts
        in die Ladedauer umgerechnet.
      required: false
      example: 1751886600
      selector:
        number:
          mode: box
    soc_start:
      name: SoC Start (%)
      required: false
      example: 32
      selector:
        number:
          mode: box
          min: 0
          max: 100
    soc_end:
      name: SoC Ende (%)
      required: false
      example: 74
      selector:
        number:
          mode: box
          min: 0
          max: 100
    karte_id:
      name: Ladekarte
      description: >
        Optional. Ändert die zugeordnete Ladekarte (Wert aus deren
        id-Attribut). 0 entfernt eine bestehende Zuordnung wieder.
      required: false
      example: 1755000000000
      selector:
        number:
          mode: box
    anbieter:
      name: Anbieter
      description: >
        Optional. Ändert den Ladenetz-/Betreibernamen (WO geladen wurde,
        siehe log_charge). Ein leerer Text entfernt einen bestehenden
        Anbieter wieder.
      required: false
      example: EnBW
      selector:
        text:

delete_charge:
  name: Fremdladung löschen
  description: >
    Löscht einen bereits erfassten Historien-Eintrag vollständig (z.B.
    eine fälschlich erkannte Fremdladung, die gar keine war). Die
    Gesamtsummen (kWh/Kosten/Anzahl) werden entsprechend verringert.
    Nicht rückgängig zu machen. Der zu löschende Eintrag wird über
    erfasst_ts identifiziert (Wert aus dessen erfasst_ts-Attribut in der
    Historie).
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    erfasst_ts:
      name: Erfasst-Zeitstempel (Unix)
      description: Identifiziert den zu löschenden Historien-Eintrag (Wert aus dessen erfasst_ts-Attribut).
      required: true
      example: 1751884800
      selector:
        number:
          mode: box

simulate_event:
  name: Fremdladung simulieren (Test)
  description: >
    Erzeugt zum Testen eine offene Fremdladung (ohne Auto). Loest
    Benachrichtigung und Sensoren aus.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    soc_start:
      name: SoC Start (%)
      required: true
      example: 32
      selector:
        number: { min: 0, max: 100, step: 1, mode: box }
    soc_end:
      name: SoC Ende (%)
      required: true
      example: 74
      selector:
        number: { min: 0, max: 100, step: 1, mode: box }
    energy_source:
      name: Energiequelle
      required: false
      example: soc
      selector:
        select:
          options: [soc, power_ac, power_dc]

log_trip:
  name: Fahrt erfassen
  description: >
    Bestaetigt eine offene, automatisch erkannte Fahrt mit Start- und
    Zielort. Sind mehrere Fahrten gleichzeitig offen, waehlt start_ts die
    gemeinte aus (ohne Angabe: die aelteste). Ohne offene Fahrt passiert
    nichts -- Kilometerstand-Werte stammen ausschliesslich aus der
    Erkennung, nicht aus einem manuellen Einzeleintrag.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    start_ort:
      name: Startort
      required: true
      example: Zuhause
      selector:
        text:
    end_ort:
      name: Zielort
      required: true
      example: Büro
      selector:
        text:
    start_ts:
      name: Startzeit (Unix)
      description: >
        Optional. Bei mehreren gleichzeitig offenen Fahrten: waehlt die zu
        bestaetigende aus (Wert aus deren start_ts-Attribut).
      required: false
      example: 1751884800
      selector:
        number:
          mode: box

discard_pending_trip:
  name: Offene Fahrt verwerfen
  description: >
    Verwirft eine offene, unbestaetigte Fahrt. Sind mehrere gleichzeitig
    offen, waehlt start_ts die gemeinte aus (ohne Angabe: die aelteste).
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    start_ts:
      name: Startzeit (Unix)
      description: >
        Optional. Bei mehreren gleichzeitig offenen Fahrten: waehlt die zu
        verwerfende aus (Wert aus deren start_ts-Attribut).
      required: false
      example: 1751884800
      selector:
        number:
          mode: box

export_fahrtenbuch:
  name: Fahrtenbuch exportieren
  description: >
    Schreibt das komplette Fahrtenbuch als CSV-Datei nach
    /config/www/ev_assistant_fahrtenbuch_[config_entry_id].csv (chronologisch
    aufsteigend) und meldet den Download-Link per Benachrichtigung.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant

import_fahrtenbuch:
  name: Fahrtenbuch importieren
  description: >
    Importiert historische Fahrten aus einer Fremdquelle (z.B. Export einer
    anderen Fahrtenbuch-App) direkt ins Fahrtenbuch, ohne die
    Kilometerstand-Erkennung -- Kilometerstaende bleiben dabei leer, nur
    Datum, Start-/Zielort und Strecke werden uebernommen. Je Eintrag: start/
    ende als "YYYY-MM-DD HH:MM:SS" (lokale Zeit), start_ort, ziel_ort,
    strecke (km), optional verbrauch_kwh/avg_verbrauch/avg_speed. Bereits
    importierte Fahrten (gleiche Startzeit) werden bei einem erneuten Aufruf
    uebersprungen.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    trips:
      name: Fahrten
      description: >
        Liste von Fahrten, je ein Objekt mit start, start_ort, ende,
        ziel_ort, strecke (km) und optional verbrauch_kwh/avg_verbrauch/
        avg_speed.
      required: true
      example: >
        [{"start": "2026-08-03 09:21:28", "start_ort": "Home", "ende": "2026-08-03 09:41:57", "ziel_ort": "L 237, Moers", "strecke": 25.0}]
      selector:
        object:

simulate_trip:
  name: Fahrt simulieren (Test)
  description: >
    Erzeugt zum Testen eine offene Fahrt (ohne Auto). Loest
    Benachrichtigung und Sensoren aus.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    km:
      name: Strecke (km)
      required: true
      example: 12.5
      selector:
        number:
          min: 0
          max: 2000
          step: 0.1
          unit_of_measurement: km
          mode: box

edit_trip:
  name: Fahrt nachträglich korrigieren
  description: >
    Korrigiert einen bereits bestätigten Fahrtenbuch-Eintrag nachträglich
    (z.B. Tippfehler oder eine falsch erkannte Strecke). Alle Felder außer
    config_entry_id/erfasst_ts sind optional -- nur mitgegebene Werte werden
    geändert. Ändert sich km, wird die Fahrtenbuch-Gesamtsumme um die
    Differenz angepasst. Ändern sich soc_start/soc_end, wird verbrauch_kwh
    automatisch neu berechnet (außer es wird selbst mitgegeben).
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    erfasst_ts:
      name: Erfasst-Zeitstempel (Unix)
      description: Identifiziert den zu korrigierenden Fahrtenbuch-Eintrag (Wert aus dessen erfasst_ts-Attribut).
      required: true
      example: 1751884800
      selector:
        number:
          mode: box
    start_ort:
      name: Startort
      required: false
      example: Zuhause
      selector:
        text:
    end_ort:
      name: Zielort
      required: false
      example: Büro
      selector:
        text:
    start_ts:
      name: Startzeit (Unix)
      description: Ändert auch das für den CSV-Export genutzte Datum.
      required: false
      example: 1751884800
      selector:
        number:
          mode: box
    end_ts:
      name: Endzeit (Unix)
      required: false
      example: 1751886600
      selector:
        number:
          mode: box
    km:
      name: Strecke (km)
      required: false
      example: 12.5
      selector:
        number:
          mode: box
          min: 0
          max: 2000
    odo_start:
      name: Kilometerstand Start
      required: false
      example: 12345.6
      selector:
        number:
          mode: box
    odo_end:
      name: Kilometerstand Ende
      required: false
      example: 12358.1
      selector:
        number:
          mode: box
    soc_start:
      name: SoC Start (%)
      required: false
      example: 80
      selector:
        number:
          mode: box
          min: 0
          max: 100
    soc_end:
      name: SoC Ende (%)
      required: false
      example: 60
      selector:
        number:
          mode: box
          min: 0
          max: 100
    verbrauch_kwh:
      name: Verbrauch (kWh)
      description: Überschreibt den aus SoC-Delta berechneten Wert, falls gesetzt.
      required: false
      example: 9.0
      selector:
        number:
          mode: box
          min: 0

delete_trip:
  name: Fahrt löschen
  description: >
    Löscht einen bereits bestätigten Fahrtenbuch-Eintrag vollständig
    (z.B. eine fälschlich erkannte Fahrt). Die Gesamtsummen (km/Anzahl)
    werden entsprechend verringert. Nicht rückgängig zu machen.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    erfasst_ts:
      name: Erfasst-Zeitstempel (Unix)
      description: Identifiziert den zu löschenden Fahrtenbuch-Eintrag (Wert aus dessen erfasst_ts-Attribut).
      required: true
      example: 1751884800
      selector:
        number:
          mode: box

add_ladekarte:
  name: Ladekarte anlegen
  description: >
    Legt eine neue Ladekarte an (z.B. eine Abo-Karte eines
    Fremdlade-Anbieters mit monatlicher Grundgebühr). Die aufgelaufene
    Grundgebühr fließt automatisch in die Fremdladung-Gesamtkosten ein
    (Ersparnis-Vergleich, EUR/100km, Kosten-Perioden), aber nicht in den
    Preis pro kWh einzelner Ladungen. Bietet der Anbieter zunächst einen
    reduzierten Einführungspreis an, der später auf den regulären Preis
    steigt, zunächst mit dem Einführungspreis anlegen und den späteren
    Preiswechsel per add_ladekarte_preisstufe nachtragen.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    name:
      name: Name
      description: Bezeichnung der Karte/des Anbieters.
      required: true
      example: ADAC e-Charge
      selector:
        text:
    monatliche_gebuehr:
      name: Monatliche Grundgebühr
      description: Die zunächst gültige Gebühr (z.B. ein Einführungspreis).
      required: true
      example: 5.90
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    start_datum:
      name: Startdatum
      description: Ab wann die Karte aktiv ist (Vertragsbeginn).
      required: true
      example: "2026-01-01"
      selector:
        date:
    end_datum:
      name: Enddatum
      description: Optional, falls die Karte bereits gekündigt/befristet ist.
      required: false
      example: "2026-12-31"
      selector:
        date:

edit_ladekarte:
  name: Ladekarte korrigieren
  description: >
    Korrigiert eine bestehende Ladekarte. Alle Felder außer
    config_entry_id/karte_id sind optional -- nur mitgegebene Werte werden
    geändert.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    karte_id:
      name: Karten-ID
      description: Identifiziert die zu korrigierende Karte (Wert aus deren id-Attribut).
      required: true
      example: 1755000000000
      selector:
        number:
          mode: box
    name:
      name: Name
      required: false
      example: ADAC e-Charge
      selector:
        text:
    monatliche_gebuehr:
      name: Monatliche Grundgebühr
      description: >
        Korrigiert die Gebühr der zeitlich frühesten Stufe (z.B. ein
        Tippfehler beim Anlegen). Für einen echten Preiswechsel (z.B. Ende
        eines Einführungspreises) stattdessen add_ladekarte_preisstufe
        verwenden.
      required: false
      example: 6.90
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    start_datum:
      name: Startdatum
      required: false
      example: "2026-01-01"
      selector:
        date:
    end_datum:
      name: Enddatum
      description: >
        Optional. Leer lassen, um ein zuvor gesetztes Enddatum wieder zu
        entfernen (Karte reaktivieren).
      required: false
      example: "2026-12-31"
      selector:
        date:

delete_ladekarte:
  name: Ladekarte löschen
  description: >
    Löscht eine Ladekarte vollständig. Bereits zugeordnete Fremdladungen
    behalten ihre Zuordnung als reine (dann verwaiste) Referenz -- die
    Historie selbst wird nicht verändert. Nicht rückgängig zu machen.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    karte_id:
      name: Karten-ID
      description: Identifiziert die zu löschende Karte (Wert aus deren id-Attribut).
      required: true
      example: 1755000000000
      selector:
        number:
          mode: box

add_ladekarte_preisstufe:
  name: Ladekarte-Preisstufe hinzufügen
  description: >
    Fügt einer bestehenden Ladekarte eine neue Gebührenstufe hinzu -- z.B.
    wenn ein reduzierter Einführungspreis nach einigen Monaten auf den
    regulären Preis steigt. Jede Stufe gilt ab ihrem Datum bis zur
    nächsten (nach Datum sortiert, Reihenfolge der Aufrufe ist egal).
    Existiert bereits eine Stufe mit exakt diesem Datum, wird deren Gebühr
    ersetzt statt eine doppelte Stufe anzulegen.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    karte_id:
      name: Karten-ID
      description: Identifiziert die Karte (Wert aus deren id-Attribut).
      required: true
      example: 1755000000000
      selector:
        number:
          mode: box
    gebuehr:
      name: Monatliche Gebühr ab diesem Datum
      required: true
      example: 5.90
      selector:
        number:
          min: 0
          max: 500
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    ab_datum:
      name: Gültig ab
      required: true
      example: "2026-04-01"
      selector:
        date:

delete_ladekarte_preisstufe:
  name: Ladekarte-Preisstufe entfernen
  description: >
    Entfernt eine zuvor hinzugefügte Gebührenstufe wieder (z.B. eine
    versehentlich angelegte). Die zeitlich früheste Stufe einer Karte kann
    nicht entfernt werden -- eine Karte braucht immer mindestens eine
    bekannte Gebühr.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    karte_id:
      name: Karten-ID
      description: Identifiziert die Karte (Wert aus deren id-Attribut).
      required: true
      example: 1755000000000
      selector:
        number:
          mode: box
    ab_datum:
      name: Zu entfernende Stufe
      description: Das Datum der zu entfernenden Gebührenstufe.
      required: true
      example: "2026-04-01"
      selector:
        date:

add_maintenance:
  name: Wartungspunkt anlegen
  description: >
    Legt einen neuen Wartungspunkt an (z.B. HU/TÜV, Inspektion, oder frei
    benannt). Fälligkeit kann auf bis zu drei Kriterien beruhen
    (Kilometer-Intervall, Zeit-Intervall in Monaten, festes Datum) -- bei
    mehreren gilt "je nachdem was zuerst kommt". Mindestens eines der drei
    Kriterien muss angegeben werden (auch über preset). preset füllt
    Name/Intervalle einer Vorlage vor, jedes Feld bleibt einzeln
    überschreibbar.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    name:
      name: Name
      description: Erforderlich, außer preset liefert bereits einen Namen.
      required: false
      example: Inspektion
      selector:
        text:
    preset:
      name: Vorlage
      description: Optional -- füllt Name/Intervalle einer Standard-Vorlage vor.
      required: false
      selector:
        select:
          options: [tuev, inspektion]
    km_intervall:
      name: Kilometer-Intervall
      description: Fällig alle X km seit dem letzten Service.
      required: false
      example: 30000
      selector:
        number:
          min: 0
          max: 200000
          step: 100
          unit_of_measurement: km
          mode: box
    zeit_intervall_monate:
      name: Zeit-Intervall (Monate)
      description: Fällig alle X Monate seit dem letzten Service (echter Kalendersprung, z.B. 31.01. + 1 Monat = 28./29.02.).
      required: false
      example: 24
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: Monate
          mode: box
    festes_datum:
      name: Festes Fälligkeitsdatum
      description: >
        Bereits bekannter nächster Termin, unabhängig vom letzten Service.
        Zusammen mit zeit_intervall_monate (z.B. HU/TÜV) wird dieses Datum
        beim Erledigt-Markieren automatisch um das Intervall fortgeschrieben.
      required: false
      example: "2026-06-01"
      selector:
        date:
    kosten:
      name: Kosten (optional)
      description: Letzte/geschätzte Kosten, rein informativ.
      required: false
      example: 250.0
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    last_done_km:
      name: Letzter Service -- Kilometerstand (optional)
      description: Zum Nacherfassen eines bereits vergangenen Service.
      required: false
      example: 45000
      selector:
        number:
          mode: box
    last_done_datum:
      name: Letzter Service -- Datum (optional)
      required: false
      example: "2026-01-15"
      selector:
        date:
    reminder_monate:
      name: Erinnerung (Monate, optional)
      description: >
        Überschreibt für diesen Punkt, wie viele Monate vor der zeit-/
        datumsbasierten Fälligkeit "bald fällig" angezeigt wird (Standard
        sonst global). Wird intern in Tage umgerechnet.
      required: false
      example: 1
      selector:
        number:
          min: 0
          max: 24
          step: 0.5
          unit_of_measurement: Monate
          mode: box
    reminder_km:
      name: Erinnerung (km, optional)
      description: Überschreibt für diesen Punkt, wie viele km vor der km-basierten Fälligkeit "bald fällig" angezeigt wird.
      required: false
      example: 500
      selector:
        number:
          min: 0
          max: 10000
          step: 50
          unit_of_measurement: km
          mode: box

edit_maintenance:
  name: Wartungspunkt korrigieren
  description: >
    Korrigiert einen bestehenden Wartungspunkt. Alle Felder außer
    config_entry_id/wartung_id sind optional -- nur mitgegebene Werte
    werden geändert. km_intervall/zeit_intervall_monate/festes_datum/kosten/
    reminder_monate/reminder_km leer lassen entfernt das jeweilige Feld
    wieder -- bei den drei Fälligkeitskriterien muss danach mindestens
    eines übrig bleiben, sonst wird die gesamte Änderung verworfen.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    wartung_id:
      name: Wartungspunkt-ID
      description: Identifiziert den zu korrigierenden Punkt (Wert aus dessen id-Attribut).
      required: true
      example: 1755000000000
      selector:
        number:
          mode: box
    name:
      name: Name
      required: false
      example: Inspektion
      selector:
        text:
    km_intervall:
      name: Kilometer-Intervall
      required: false
      example: 30000
      selector:
        number:
          min: 0
          max: 200000
          step: 100
          unit_of_measurement: km
          mode: box
    zeit_intervall_monate:
      name: Zeit-Intervall (Monate)
      required: false
      example: 24
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: Monate
          mode: box
    festes_datum:
      name: Festes Fälligkeitsdatum
      required: false
      example: "2026-06-01"
      selector:
        date:
    kosten:
      name: Kosten (optional)
      required: false
      example: 250.0
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    last_done_km:
      name: Letzter Service -- Kilometerstand (optional)
      description: Korrigiert den zuletzt erfassten Service direkt (z.B. Tippfehler).
      required: false
      example: 45000
      selector:
        number:
          mode: box
    last_done_datum:
      name: Letzter Service -- Datum (optional)
      required: false
      example: "2026-01-15"
      selector:
        date:
    aktiv:
      name: Aktiv
      description: Deaktivieren pausiert den Punkt (keine Fälligkeit/Benachrichtigung), ohne ihn zu löschen.
      required: false
      selector:
        boolean:
    reminder_monate:
      name: Erinnerung (Monate, optional)
      description: Überschreibt für diesen Punkt die zeit-/datumsbasierte "bald fällig"-Vorwarnzeit. Wird intern in Tage umgerechnet.
      required: false
      example: 1
      selector:
        number:
          min: 0
          max: 24
          step: 0.5
          unit_of_measurement: Monate
          mode: box
    reminder_km:
      name: Erinnerung (km, optional)
      description: Überschreibt für diesen Punkt die km-basierte "bald fällig"-Vorwarnzeit.
      required: false
      example: 500
      selector:
        number:
          min: 0
          max: 10000
          step: 50
          unit_of_measurement: km
          mode: box

delete_maintenance:
  name: Wartungspunkt löschen
  description: Löscht einen Wartungspunkt vollständig.
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    wartung_id:
      name: Wartungspunkt-ID
      description: Identifiziert den zu löschenden Punkt (Wert aus dessen id-Attribut).
      required: true
      example: 1755000000000
      selector:
        number:
          mode: box

mark_maintenance_done:
  name: Wartung als erledigt markieren
  description: >
    Setzt den letzten Service auf den aktuellen Kilometerstand und heute
    -- oder auf km/datum, falls angegeben (z.B. um einen vor ein paar
    Tagen tatsächlich durchgeführten Termin nachzutragen).
  fields:
    config_entry_id:
      name: Fahrzeug
      description: Welches Fahrzeug (bei mehreren EV-Assistant-Instanzen).
      required: true
      selector:
        config_entry:
          integration: ev_assistant
    wartung_id:
      name: Wartungspunkt-ID
      description: Identifiziert den Punkt (Wert aus dessen id-Attribut).
      required: true
      example: 1755000000000
      selector:
        number:
          mode: box
    km:
      name: Kilometerstand (optional)
      description: Ohne Angabe wird der aktuelle Kilometerstand verwendet.
      required: false
      example: 45000
      selector:
        number:
          mode: box
    datum:
      name: Datum (optional)
      description: Ohne Angabe wird heute verwendet.
      required: false
      example: "2026-01-15"
      selector:
        date:
